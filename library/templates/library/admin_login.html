{% extends 'library/base.html' %}

{% block title %}Admin Login | Library MS{% endblock %}

{% block content %}
<div class="login-container">
  <div class="login-card">
    <div class="login-logo">
      <div class="icon-wrap">🔑</div>
      <h2>Admin Login</h2>
      <p>Enter administrative credentials to proceed</p>
    </div>

    <form method="POST" action="{% url 'library:admin_login' %}">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" placeholder="Enter admin username" required autofocus>
      </div>

      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
      </div>

      <button type="submit" class="btn btn-primary w-100" style="justify-content: center; padding: 12px;">
        Login to Dashboard
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem;">
      <a href="{% url 'library:public_home' %}" style="font-size: 0.85rem; color: var(--text-secondary);">
        ← Back to View Mode (Public Catalog)
      </a>
    </div>
  </div>
</div>
{% endblock %}
